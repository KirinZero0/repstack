<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1014" />
  <title>You're offline · Liftmora</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      background: #0c1014; color: #f4f4f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; }
    svg { color: #e8b923; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #a1a1aa; line-height: 1.5; }
    button { font: inherit; font-weight: 600; background: #f4f4f5; color: #0c1014; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg width="56" height="56" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="4"/><circle cx="16" cy="16" r="4" stroke="currentColor" stroke-width="2.5"/>
    </svg>
    <h1>You're offline</h1>
    <p>Liftmora needs a connection to show up-to-date members, check-ins and payments. Check your signal or Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
